const clone=x=>structuredClone(x),isAdmin=()=>location.hash==='#admin',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),find=id=>state.courses.find(c=>c.id===id);
function note(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,5000)}
function warning(t){$('storageWarning').textContent=t;$('storageWarning').hidden=false}
try{lastRaw=localStorage.getItem(key)||'';if(lastRaw)state=PortalCore.validate(JSON.parse(lastRaw))}catch(e){saveBlocked=true;warning('原有資料無法讀取，已保留原始儲存內容。請匯入有效備份或重設示範資料。')}
function commit(n,message,recover=false){try{PortalCore.validate(n);if(saveBlocked&&!recover)throw Error('請先匯入有效備份或重設資料。');let stored='';try{stored=localStorage.getItem(key)||''}catch{}if(stored!==lastRaw&&!recover)throw Error('其他分頁已更新，請重新整理後再操作。');const raw=JSON.stringify(n);let ok=true;try{localStorage.setItem(key,raw);lastRaw=raw;saveBlocked=false;$('storageWarning').hidden=true}catch{ok=false;warning('瀏覽器無法儲存。本次操作僅暫存在頁面，請立即匯出備份。')}state=n;render();note(message+(ok?'':'（請匯出備份）'));return true}catch(e){note(e.message);return false}}
function selected(){return state.courses.filter(c=>c.category==='REQUIRED'||state.enrolled.includes(c.id))}
function filtered(cs){const q=$('search').value.trim().toLowerCase();return cs.filter(c=>[c.name,c.code,c.teacher,c.classroom].join(' ').toLowerCase().includes(q))}
function period(c){return `${days[c.day_of_week]} 第 ${c.start_period}–${c.end_period} 節`}
function detailButton(c){return `<button data-detail="${esc(c.id)}" style="border:0;padding:0;text-align:left;background:transparent;color:var(--blue)"><strong>${esc(c.name)}</strong></button><small>${esc(c.code)}</small>`}
function render(){const admin=isAdmin();$('studentRole').setAttribute('aria-current',admin?'false':'page');$('adminRole').setAttribute('aria-current',admin?'page':'false');$('roleLabel').textContent=admin?'ADMIN · DEMONSTRATION':'STUDENT · DEMONSTRATION';$('heading').textContent=admin?'資管一甲・課程維護':'資管一甲・我的課表';$('summary').textContent=admin?'維護全班必修及選修目錄，立即在本瀏覽器的學生端查看結果。':'學生示範帳號｜全班必修自動排入，可自行加退選額外課程。';$('date').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'long'}).format(new Date());const cs=selected();const req=cs.filter(c=>c.category==='REQUIRED').reduce((s,c)=>s+c.credits,0),elect=cs.filter(c=>c.category==='ELECTIVE').reduce((s,c)=>s+c.credits,0);const stats=admin?[['課程總數',state.courses.length],['必修課程',state.courses.filter(c=>c.category==='REQUIRED').length],['選修課程',state.courses.filter(c=>c.category==='ELECTIVE').length],['本機已加選',state.enrolled.length]]:[['已選總學分',req+elect],['必修學分',req],['選修學分',elect],['已選門數',cs.length]];$('stats').innerHTML=stats.map(([l,v])=>`<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');$('tabs').hidden=admin;$('tabs').innerHTML=[['timetable','我的週課表'],['electives','額外選修加選區'],['enrolled','已選課程明細']].map(([t,l])=>`<button role="tab" aria-selected="${tab===t}" data-tab="${t}">${l}</button>`).join('');$('addBtn').hidden=!admin;$('search').hidden=!admin&&tab==='timetable';$('printBtn').hidden=admin||tab!=='timetable';
if(!admin&&tab==='timetable'){const now=new Date().getDay()||7;$('sectionTitle').textContent='本學期每週課表';$('resultCount').textContent='藍色：必修　綠色：選修';let h='<table class="week"><thead><tr><th>節次／時間</th>'+days.slice(1).map((d,i)=>`<th class="${i+1===now?'today':''}">${d}${i+1===now?'・今天':''}</th>`).join('')+'</tr></thead><tbody>';for(let slot=1;slot<=9;slot++){h+=`<tr><th>第 ${slot} 節<small>${times[slot-1]}</small></th>`;for(let day=1;day<=7;day++){const c=cs.find(c=>c.day_of_week===day&&c.start_period<=slot&&c.end_period>=slot);if(c){if(c.start_period===slot)h+=`<td rowspan="${c.end_period-c.start_period+1}"><button class="course ${c.category==='ELECTIVE'?'elective':''}" data-detail="${esc(c.id)}"><b>${esc(c.name)}</b><small>${esc(c.teacher)}</small><small>${esc(c.classroom)}</small><small>${c.credits} 學分 · ${c.category==='REQUIRED'?'必修':'選修'}</small></button></td>`}else h+='<td></td>'}h+='</tr>'}h+='</tbody></table>';$('content').innerHTML=h;return}
const list=filtered(admin?state.courses:tab==='electives'?state.courses.filter(c=>c.category==='ELECTIVE'):cs).sort((a,b)=>a.day_of_week-b.day_of_week||a.start_period-b.start_period);$('sectionTitle').textContent=admin?'課程管理':tab==='electives'?'可供加選的選修課程':'已選課程明細';$('resultCount').textContent=`共 ${list.length} 門`;let h='<table><thead><tr><th>課程名稱／代碼</th><th>類別</th><th>時段</th><th>教師／教室</th><th>學分</th><th>狀態</th><th>操作</th></tr></thead><tbody>';for(const c of list){const enrolled=state.enrolled.includes(c.id);let status=c.category==='REQUIRED'?'<span class="tag">全班必修</span>':`<span class="tag ${c.is_open_for_enrollment?'green':'gray'}">${c.is_open_for_enrollment?'開放加選':'未開放'}</span><small>本機人數 ${enrolled?1:0}/${c.max_students}</small>`;let action='';if(admin)action=`<div class="actions"><button data-edit="${esc(c.id)}">編輯</button><button class="danger" data-remove="${esc(c.id)}">刪除</button></div>`;else if(c.category==='REQUIRED')action='<span class="sub">不可退選</span>';else if(enrolled)action=`<button class="danger" data-drop="${esc(c.id)}">退選</button>`;else action=`<button class="primary" data-enroll="${esc(c.id)}" ${c.is_open_for_enrollment?'':'disabled'}>加選</button>`;h+=`<tr><td>${detailButton(c)}</td><td><span class="tag ${c.category==='ELECTIVE'?'green':''}">${c.category==='REQUIRED'?'必修':'選修'}</span></td><td>${period(c)}</td><td>${esc(c.teacher)}<small>${esc(c.classroom)}</small></td><td>${c.credits}</td><td>${status}</td><td>${action}</td></tr>`}h+=list.length?'':'<tr><td colspan="7" class="empty">沒有符合的課程。</td></tr>';h+='</tbody></table>';$('content').innerHTML=h}
function openEdit(id){if(!isAdmin())return;const c=id?find(id):null;$('courseForm').reset();$('formError').hidden=true;$('editTitle').textContent=c?'編輯課程':'新增課程';$('courseId').value=c?.id||'';$('day_of_week').innerHTML=days.slice(1).map((d,i)=>`<option value="${i+1}">${d}</option>`).join('');const slots=times.map((t,i)=>`<option value="${i+1}">第 ${i+1} 節（${t}）</option>`).join('');$('start_period').innerHTML=slots;$('end_period').innerHTML=slots;for(const k of ['code','name','teacher','classroom','description'])$(k).value=c?.[k]||'';for(const [k,v] of Object.entries({credits:2,category:'ELECTIVE',day_of_week:5,start_period:5,end_period:6,max_students:45}))$(k).value=c?.[k]??v;$('category').disabled=!!c;$('is_open_for_enrollment').checked=c?.is_open_for_enrollment??true;$('editDialog').showModal()}
function detail(id){const c=find(id);if(!c)return;$('detailTitle').textContent=c.name;$('detailBody').innerHTML=`<span class="tag">${esc(c.code)} · ${c.category==='REQUIRED'?'必修':'選修'}</span><dl class="detailgrid"><div><dt>授課教師</dt><dd>${esc(c.teacher)}</dd></div><div><dt>上課教室</dt><dd>${esc(c.classroom)}</dd></div><div><dt>上課時段</dt><dd>${period(c)}</dd></div><div><dt>學分數</dt><dd>${c.credits} 學分</dd></div></dl><h2>課程大綱</h2><p class="longtext">${esc(c.description||'尚無說明')}</p>`;$('detailDialog').showModal()}
$('courseForm').onsubmit=e=>{e.preventDefault();if(!isAdmin())return;const c={id:$('courseId').value||('c_'+(crypto.randomUUID?.()||Date.now())),is_open_for_enrollment:$('is_open_for_enrollment').checked};for(const k of ['code','name','teacher','classroom','description','category'])c[k]=$(k).value.trim();c.code=c.code.toUpperCase();for(const k of ['credits','day_of_week','start_period','end_period','max_students'])c[k]=Number($(k).value);try{const n=clone(state);const old=n.courses.find(x=>x.id===c.id);if(old&&old.category!==c.category)throw Error('既有課程不可切換類別。');n.courses=n.courses.filter(x=>x.id!==c.id);n.courses.push(c);PortalCore.validate(n);if(commit(n,'課程已儲存，切換學生端即可查看'))$('editDialog').close()}catch(err){$('formError').textContent=err.message;$('formError').hidden=false}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close)$(b.dataset.close).close();if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.detail)detail(b.dataset.detail);if(b.dataset.edit)openEdit(b.dataset.edit);if(b.dataset.enroll){try{commit(PortalCore.enroll(state,b.dataset.enroll),'加選成功，課表與學分已更新')}catch(err){note(err.message)}}if(b.dataset.drop&&confirm('確定退選此課程？')){const n=clone(state);n.enrolled=n.enrolled.filter(id=>id!==b.dataset.drop);commit(n,'已退選課程')}if(b.dataset.remove&&isAdmin()){if(state.enrolled.includes(b.dataset.remove)){note('此課程已被示範學生加選，請先從學生端退選。');return}if(confirm('確定刪除此課程？必修刪除也會從學生課表移除。')){const n=clone(state);n.courses=n.courses.filter(c=>c.id!==b.dataset.remove);commit(n,'課程已刪除')}}});
$('addBtn').onclick=()=>openEdit();$('search').oninput=render;$('printBtn').onclick=()=>window.print();$('start_period').onchange=()=>{if(Number($('end_period').value)<Number($('start_period').value))$('end_period').value=$('start_period').value};
window.onhashchange=()=>{$('editDialog').close();$('detailDialog').close();$('search').value='';render()};
$('resetBtn').onclick=()=>{if(confirm('重設會清除目前課程修改與加選紀錄。建議先匯出備份，確定繼續？'))commit({version:1,courses:clone(SEED),enrolled:[]},'示範資料已重設',true)};
$('exportBtn').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='資管一甲_選課示範備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);note('已產生備份，請確認瀏覽器下載完成')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>2*1024*1024)throw Error('檔案上限為 2 MB');const n=PortalCore.validate(JSON.parse(await f.text()));if(confirm(`備份含 ${n.courses.length} 門課程，將覆蓋本機資料，確定繼續？`))commit(n,'備份已還原',true)}catch(err){note('匯入失敗，原資料未更動：'+err.message)}};
window.addEventListener('storage',e=>{if(e.key!==key||!e.newValue)return;if($('editDialog').open){warning('其他分頁已修改資料，請先複製未儲存內容，再重新整理。');return}try{state=PortalCore.validate(JSON.parse(e.newValue));lastRaw=e.newValue;render();note('已更新其他分頁的資料')}catch{warning('其他分頁資料異常，請先匯出目前備份。')}});render();
</script></body></html>
